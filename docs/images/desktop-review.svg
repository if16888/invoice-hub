<rect class="surface" x="218" y="24" width="958" height="672" rx="20"/><text class="t b" x="250" y="70">发票审核</text><text class="s" x="250" y="100">快速切换候选记录，核对原件并完成审核</text>
<rect class="surface" x="250" y="128" width="316" height="530" rx="16"/><rect class="soft" x="266" y="152" width="284" height="64" rx="12"/>
<text class="t" x="284" y="180">模拟记录 A</text><text class="s" x="284" y="204">待审核 · 餐饮</text>
<text class="t" x="284" y="258">模拟记录 B</text><text class="s" x="284" y="282">已通过 · 交通</text><line class="line" x1="266" y1="302" x2="550" y2="302"/>
<text class="t" x="284" y="344">模拟记录 C</text><text class="s" x="284" y="368">待补全 · 住宿</text><line class="line" x1="266" y1="388" x2="550" y2="388"/>
<text class="t" x="284" y="430">模拟记录 D</text><text class="s" x="284" y="454">异常 · 其他</text>
