<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Invoice Hub 发票审核工作台示意</title><desc id="desc">完全合成的桌面审核界面示意图，不包含真实票据信息。</desc>
<style>
.bg{fill:#f7f8fa}.surface{fill:#fff;stroke:#e5e7eb;stroke-width:2}.nav{fill:#182230}.accent{fill:#2563eb}.soft{fill:#eff6ff}.line{stroke:#e5e7eb;stroke-width:2}
.t{fill:#182230;font:22px "Segoe UI","Microsoft YaHei",sans-serif}.s{fill:#667085;font:16px "Segoe UI","Microsoft YaHei",sans-serif}.w{fill:#fff;font:18px "Segoe UI","Microsoft YaHei",sans-serif}.b{font-weight:700}
</style>
<rect class="bg" width="1200" height="720" rx="24"/><rect class="nav" x="24" y="24" width="170" height="672" rx="20"/>
<text class="w b" x="54" y="74">Invoice Hub</text><rect class="accent" x="44" y="112" width="130" height="44" rx="10"/><text class="w" x="66" y="141">发票审核</text>
