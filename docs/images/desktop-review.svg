<rect x="618" y="196" width="262" height="354" rx="10" fill="#fbfcfd" stroke="#d0d5dd" stroke-width="2"/><rect x="648" y="232" width="202" height="18" rx="4" fill="#d0d5dd"/>
<rect x="648" y="270" width="154" height="12" rx="4" fill="#e4e7ec"/><rect x="648" y="298" width="180" height="12" rx="4" fill="#e4e7ec"/><rect x="648" y="352" width="202" height="118" rx="8" fill="#f2f4f7"/>
<text class="s" x="646" y="588">合成预览 · 无真实票据</text>
