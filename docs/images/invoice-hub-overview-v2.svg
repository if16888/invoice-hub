<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Invoice Hub desktop review overview</title>
<desc id="desc">Synthetic overview modeled on the current Invoice Hub desktop review workbench layout.</desc>
<rect width="1600" height="900" fill="#f4f6f9"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
  <text x="70" y="72" font-size="44" font-weight="700" fill="#111827">Invoice Hub</text>
  <text x="70" y="108" font-size="23" fill="#64748b">本地优先的发票审核与报销整理工具</text>
  <rect x="1320" y="48" width="210" height="44" rx="22" fill="#eef4ff"/>
  <text x="1350" y="77" font-size="18" font-weight="700" fill="#245fc7">v0.1.5-rc7 · RC</text>

  <!-- desktop window -->
  <rect x="70" y="145" width="1460" height="635" rx="16" fill="#ffffff" stroke="#cfd7e3" stroke-width="2"/>
  <rect x="70" y="145" width="1460" height="48" rx="16" fill="#f8fafc"/>
  <rect x="70" y="177" width="1460" height="16" fill="#f8fafc"/>
  <circle cx="101" cy="169" r="5" fill="#cbd5e1"/><circle cx="119" cy="169" r="5" fill="#cbd5e1"/>
  <text x="145" y="176" font-size="16" font-weight="600" fill="#334155">Invoice Hub</text>

  <!-- sidebar -->
  <rect x="70" y="193" width="210" height="587" fill="#f8fafc"/>
  <text x="102" y="234" font-size="14" fill="#94a3b8">工作台</text>
  <rect x="88" y="253" width="174" height="44" rx="8" fill="#eaf2ff"/>
  <text x="112" y="281" font-size="17" font-weight="700" fill="#245fc7">发票审核</text>
  <text x="112" y="331" font-size="17" fill="#475569">总览</text>
  <text x="112" y="379" font-size="17" fill="#475569">报销组</text>
  <text x="112" y="427" font-size="17" fill="#475569">导出记录</text>
  <line x1="92" y1="461" x2="257" y2="461" stroke="#e2e8f0"/>
  <text x="102" y="495" font-size="14" fill="#94a3b8">设置</text>
  <text x="112" y="535" font-size="17" fill="#475569">邮箱账号</text>
  <text x="112" y="583" font-size="17" fill="#475569">AI 配置</text>
  <text x="112" y="631" font-size="17" fill="#475569">系统设置</text>
  <text x="112" y="679" font-size="17" fill="#475569">诊断与反馈</text>

  <!-- header -->
  <text x="320" y="240" font-size="30" font-weight="700" fill="#111827">发票审核</text>
  <text x="320" y="270" font-size="16" fill="#64748b">集中检查待审核发票、原件和关联材料</text>
  <rect x="1322" y="218" width="150" height="42" rx="8" fill="#2468e8"/>
  <text x="1351" y="245" font-size="16" font-weight="700" fill="#fff">扫描邮箱</text>

  <!-- toolbar -->
  <rect x="320" y="297" width="1170" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="338" y="311" width="340" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <text x="356" y="336" font-size="15" fill="#94a3b8">搜索发票号 / 销售方 / 备注</text>
  <rect x="696" y="311" width="118" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <text x="724" y="336" font-size="15" fill="#475569">待审核</text>
  <rect x="828" y="311" width="118" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <text x="858" y="336" font-size="15" fill="#475569">全部分类</text>
  <text x="1260" y="336" font-size="15" fill="#64748b">当前筛选 50 张</text>

  <!-- invoice list/table -->
  <rect x="320" y="382" width="690" height="357" rx="10" fill="#fff" stroke="#dfe5ee"/>
  <rect x="320" y="382" width="690" height="44" rx="10" fill="#f8fafc"/>
  <rect x="320" y="416" width="690" height="10" fill="#f8fafc"/>
  <text x="344" y="410" font-size="14" font-weight="700" fill="#475569">日期</text>
  <text x="458" y="410" font-size="14" font-weight="700" fill="#475569">销售方</text>
  <text x="696" y="410" font-size="14" font-weight="700" fill="#475569">金额</text>
  <text x="800" y="410" font-size="14" font-weight="700" fill="#475569">分类</text>
  <text x="918" y="410" font-size="14" font-weight="700" fill="#475569">状态</text>

  <rect x="330" y="437" width="670" height="48" rx="7" fill="#eef5ff"/>
  <text x="344" y="466" font-size="14" fill="#334155">2026-07-01</text><text x="458" y="466" font-size="14" fill="#334155">示例科技有限公司</text><text x="704" y="466" font-size="14" fill="#111827">¥256.00</text><text x="800" y="466" font-size="14" fill="#334155">办公</text><text x="918" y="466" font-size="14" fill="#245fc7">待审核</text>
  <line x1="338" y1="495" x2="992" y2="495" stroke="#edf0f4"/>
  <text x="344" y="524" font-size="14" fill="#475569">2026-06-30</text><text x="458" y="524" font-size="14" fill="#475569">示例出行服务有限公司</text><text x="704" y="524" font-size="14" fill="#111827">¥98.40</text><text x="800" y="524" font-size="14" fill="#475569">交通</text><text x="918" y="524" font-size="14" fill="#64748b">待审核</text>
  <line x1="338" y1="553" x2="992" y2="553" stroke="#edf0f4"/>
  <text x="344" y="582" font-size="14" fill="#475569">2026-06-29</text><text x="458" y="582" font-size="14" fill="#475569">示例能源有限公司</text><text x="704" y="582" font-size="14" fill="#111827">¥54.00</text><text x="800" y="582" font-size="14" fill="#475569">餐饮</text><text x="918" y="582" font-size="14" fill="#64748b">待审核</text>
  <line x1="338" y1="611" x2="992" y2="611" stroke="#edf0f4"/>
  <text x="344" y="640" font-size="14" fill="#475569">2026-06-28</text><text x="458" y="640" font-size="14" fill="#475569">示例酒店管理有限公司</text><text x="704" y="640" font-size="14" fill="#111827">¥356.00</text><text x="800" y="640" font-size="14" fill="#475569">住宿</text><text x="918" y="640" font-size="14" fill="#64748b">待审核</text>
  <line x1="338" y1="669" x2="992" y2="669" stroke="#edf0f4"/>
  <text x="344" y="698" font-size="14" fill="#475569">2026-06-27</text><text x="458" y="698" font-size="14" fill="#475569">示例航空服务有限公司</text><text x="704" y="698" font-size="14" fill="#111827">¥1250.00</text><text x="800" y="698" font-size="14" fill="#475569">交通</text><text x="918" y="698" font-size="14" fill="#64748b">待审核</text>

  <!-- right detail / preview -->
  <rect x="1030" y="382" width="460" height="357" rx="10" fill="#fff" stroke="#dfe5ee"/>
  <text x="1052" y="414" font-size="17" font-weight="700" fill="#111827">原件与信息</text>
  <rect x="1052" y="434" width="190" height="230" rx="7" fill="#f2f4f7" stroke="#d8dee8"/>
  <rect x="1086" y="454" width="122" height="176" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <rect x="1100" y="470" width="62" height="9" rx="2" fill="#d8e5fb"/>
  <line x1="1100" y1="496" x2="1194" y2="496" stroke="#d7dde6"/>
  <line x1="1100" y1="514" x2="1194" y2="514" stroke="#d7dde6"/>
  <line x1="1100" y1="532" x2="1194" y2="532" stroke="#d7dde6"/>
  <rect x="1100" y="552" width="94" height="45" rx="3" fill="#fff7ed" stroke="#f5c88b"/>
  <text x="1270" y="456" font-size="13" fill="#94a3b8">发票类型</text><text x="1270" y="480" font-size="15" fill="#334155">增值税电子发票</text>
  <text x="1270" y="520" font-size="13" fill="#94a3b8">开票日期</text><text x="1270" y="544" font-size="15" fill="#334155">2026-07-01</text>
  <text x="1270" y="584" font-size="13" fill="#94a3b8">购买方</text><text x="1270" y="608" font-size="15" fill="#334155">个人</text>
  <text x="1270" y="648" font-size="13" fill="#94a3b8">关联材料</text><text x="1270" y="672" font-size="15" fill="#334155">2 个文件</text>
  <rect x="1052" y="687" width="110" height="36" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1086" y="710" font-size="14" fill="#475569">忽略</text>
  <rect x="1174" y="687" width="110" height="36" rx="7" fill="#eef5ff" stroke="#a9c7f7"/><text x="1200" y="710" font-size="14" fill="#245fc7">通过</text>
  <rect x="1296" y="687" width="166" height="36" rx="7" fill="#2468e8"/><text x="1330" y="710" font-size="14" font-weight="700" fill="#fff">通过 &amp; 下一张</text>

  <!-- bottom notes -->
  <rect x="70" y="807" width="1460" height="58" rx="12" fill="#fff" stroke="#dfe5ee"/>
  <text x="96" y="842" font-size="16" font-weight="700" fill="#245fc7">收集 → 去重 → 审核 → 归组 → 导出</text>
  <text x="470" y="842" font-size="15" fill="#64748b">数据库/配置/日志默认保存在当前 Windows 用户 %APPDATA%\InvoiceHub；凭据使用 Windows Credential Manager。</text>
</g>
</svg>