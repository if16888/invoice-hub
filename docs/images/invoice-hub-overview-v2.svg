<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Invoice Hub 本地优先报销整理工作流</title>
  <desc id="desc">使用完全合成内容展示从邮箱、本地和手机收集材料，到审核、归组和导出的本地工作流。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".10"/>
    </filter>
    <style>
      .bg{fill:#f7f8fa}.card{fill:#fff;stroke:#e5e7eb;stroke-width:2}.muted{fill:#667085}
      .text{fill:#182230;font:28px "Segoe UI","Microsoft YaHei",sans-serif}.small{fill:#667085;font:20px "Segoe UI","Microsoft YaHei",sans-serif}
      .title{fill:#182230;font:700 44px "Segoe UI","Microsoft YaHei",sans-serif}.accent{fill:#2563eb}.accentSoft{fill:#eff6ff}
      .ok{fill:#16803c}.warn{fill:#b54708}.line{stroke:#98a2b3;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect class="bg" width="1440" height="760" rx="32"/>
  <text class="title" x="72" y="92">Invoice Hub</text>
  <text class="small" x="72" y="132">本地优先 · 收集 → 审核 → 归组 → 导出</text>

  <g filter="url(#shadow)">
    <rect class="card" x="72" y="202" width="280" height="330" rx="24"/>
    <rect class="card" x="410" y="202" width="280" height="330" rx="24"/>
    <rect class="card" x="748" y="202" width="280" height="330" rx="24"/>
    <rect class="card" x="1086" y="202" width="280" height="330" rx="24"/>
  </g>

  <circle class="accentSoft" cx="142" cy="270" r="34"/><text class="text" x="126" y="281">①</text>
  <text class="text" x="116" y="336">收集</text>
  <text class="small" x="106" y="382">邮箱附件 / 链接</text>
  <text class="small" x="106" y="418">本地 PDF / OFD / 图片</text>
  <text class="small" x="106" y="454">手机局域网上传</text>

  <circle class="accentSoft" cx="480" cy="270" r="34"/><text class="text" x="464" y="281">②</text>
  <text class="text" x="454" y="336">审核</text>
  <text class="small" x="444" y="382">原件预览</text>
  <text class="small" x="444" y="418">字段补全 / 分类</text>
  <text class="small" x="444" y="454">去重 / 状态确认</text>

  <circle class="accentSoft" cx="818" cy="270" r="34"/><text class="text" x="802" y="281">③</text>
  <text class="text" x="792" y="336">归组</text>
  <text class="small" x="782" y="382">关联证明材料</text>
  <text class="small" x="782" y="418">创建报销组</text>
  <text class="small" x="782" y="454">完整性预检</text>

  <circle class="accentSoft" cx="1156" cy="270" r="34"/><text class="text" x="1140" y="281">④</text>
  <text class="text" x="1130" y="336">导出</text>
  <text class="small" x="1120" y="382">Excel 台账</text>
  <text class="small" x="1120" y="418">manifest</text>
  <text class="small" x="1120" y="454">发票 + 证明材料包</text>

  <path class="line" d="M352 367 H396"/>
  <path class="line" d="M690 367 H734"/>
  <path class="line" d="M1028 367 H1072"/>

  <rect x="72" y="596" width="1294" height="92" rx="20" fill="#eefbf3" stroke="#b7e3c4" stroke-width="2"/>
  <circle class="ok" cx="118" cy="642" r="12"/>
  <text class="text" x="148" y="651">默认数据边界：SQLite、票据原件、配置和导出都留在本机；AI 默认关闭。</text>
</svg>
