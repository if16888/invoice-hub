name: Feature request / 功能建议
description: Suggest a focused Invoice Hub improvement / 提出一个聚焦的改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述真实使用场景，但不要上传真实发票、receipt、行程单、水单、邮箱截图、数据库、Excel 报销包、邮箱授权码、API Key、Cookie 或完整下载链接。
        Please describe the workflow without uploading real invoices, receipts, itineraries, bank slips, mailbox screenshots, databases, Excel reimbursement packages, secrets, cookies, or full download links.
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 说明当前整理发票或报销材料时卡在哪里。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 描述你希望 Invoice Hub 增加或调整什么。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代做法
      description: 说明你现在如何手动处理，注意脱敏。
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 桌面审核
        - 邮箱扫描
        - 本地导入
        - 手机上传
        - 报销组导出
        - 隐私/诊断
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: 我确认本建议不上传任何真实发票、数据库、Excel、密钥、邮箱授权码、Cookie、完整链接或其他私人财务数据。
          required: true
