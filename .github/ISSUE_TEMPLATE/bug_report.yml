name: Bug report / 问题反馈
description: Report a reproducible Invoice Hub problem / 反馈可复现的问题
title: "[Bug/问题]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请优先上传 Invoice Hub 生成的脱敏诊断包。
        Please attach only a redacted diagnostics package generated by Invoice Hub.

        请勿上传真实发票、收据、报销 Excel、SQLite 数据库、邮箱授权码、API Key、完整下载链接、含隐私的截图或原始日志。
        Do not upload real invoices, receipts, Excel reimbursement packages, SQLite databases, mailbox authorization codes, API keys, full download links, screenshots containing private data, or raw logs.
  - type: textarea
    id: summary
    attributes:
      label: Problem description / 问题描述
      description: 请简要说明遇到的问题。 / What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: 请列出触发问题的具体操作。 / List the exact actions that trigger the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: dropdown
    id: run_mode
    attributes:
      label: Run mode / 运行方式
      options:
        - Installer / 安装包
        - Portable zip / 免安装压缩包
        - Source run / 源码运行
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境信息
      description: Windows 版本、Invoice Hub 版本、安装包/免安装包/源码运行方式，以及相关显示或语言设置。 / Windows version, Invoice Hub version, run mode, and relevant display or language settings.
      placeholder: "Windows 11, InvoiceHub-Setup-0.1.0.exe, 中文界面 / Chinese UI"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics package / 脱敏诊断包
      description: 请上传“导出脱敏诊断包”生成的 zip。 / Attach the zip created by "Export redacted diagnostics package".
      placeholder: 上传 InvoiceHub-diagnostics-YYYYMMDD-HHMMSS.zip；如无法导出，请说明原因。 / Attach the diagnostics zip, or say why diagnostics export was not available.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: 我确认本 Issue 不包含真实发票、收据、附件、报销 Excel、SQLite 数据库、邮箱授权码、API Key、完整下载链接或其他私人财务数据。 / I confirm this issue does not include real invoices, receipts, attachments, Excel reimbursement packages, SQLite database files, mailbox authorization codes, API keys, full tokenized URLs, or other private financial data.
          required: true
