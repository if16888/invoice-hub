name: Bug report / 问题反馈
description: Report a reproducible Invoice Hub problem / 反馈可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请优先上传 Invoice Hub 生成的脱敏诊断包。
        Please attach only a redacted diagnostics package generated by Invoice Hub.

        不要上传真实发票、receipt、行程单、水单、邮箱截图、数据库、Excel 报销包、邮箱授权码、API Key、Cookie 或完整下载链接。
        Do not upload real invoices, receipts, itineraries, bank slips, mailbox screenshots, databases, Excel reimbursement packages, mailbox authorization codes, API keys, cookies, or full download links.
  - type: input
    id: version
    attributes:
      label: Invoice Hub 版本
      description: 例如 Invoice Hub v0.1.1、安装包/portable 包文件名或源码 commit。
      placeholder: Windows 11, Invoice Hub v0.1.1, Installer / Portable zip / Source run
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: Windows 版本和架构。
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: run_mode
    attributes:
      label: 启动方式
      options:
        - 安装包 / Installer
        - portable / Portable zip
        - 源码 / Source
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 列出触发问题的具体操作。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你原本期望发生什么。
    validations:
      required: true
  - type: dropdown
    id: diagnostics
    attributes:
      label: 是否已导出脱敏诊断包
      description: 请只上传应用生成的 InvoiceHub-diagnostics-YYYYMMDD-HHMMSS.zip。
      options:
        - 已导出并准备上传脱敏诊断包
        - 已导出但暂不上传
        - 无法导出
        - 未导出
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 只填写脱敏后的错误信息、操作说明或截图说明。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: 我确认本 Issue 不包含真实发票、receipt、行程单、水单、邮箱截图、数据库、Excel 报销包、邮箱授权码、API Key、Cookie、完整下载链接或其他私人财务数据。
          required: true
