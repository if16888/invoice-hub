name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  master_ci_attestation:
    name: Exact-master CI attestation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout exact master commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify matching successful PR CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/dev/attest_master_ci.py

  source_gates:
    name: Source gates
    needs: master_ci_attestation
    if: ${{ always() && (github.event_name == 'pull_request' || needs.master_ci_attestation.result == 'success') }}
    runs-on: ${{ github.event_name == 'push' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      PYTHONIOENCODING: "utf-8"
      INVOICE_HUB_TEST_MODE: "1"

    steps:
      - name: Reuse the exact-tree source gate from PR CI
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "Source gates were successful on the identical PR tree; see the Exact-master CI attestation job." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock.txt
            requirements-desktop.lock.txt
            requirements-build.lock.txt

      - name: Verify master attestation against exact base commit
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/dev/attest_master_ci.py --sha "${{ github.event.pull_request.base.sha }}"

      - name: Fetch previous stable tag for release metadata
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $stableVersion = (python -c "from scripts.invoice_fetch.version import PREVIOUS_STABLE_VERSION; print(PREVIOUS_STABLE_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagRef = "refs/tags/v$stableVersion"
          $refspec = $tagRef + ":" + $tagRef
          git fetch --force --no-tags --depth=1 origin $refspec
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch previous stable tag $tagRef for release metadata validation."
          }

      - name: Install Python dependencies
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.lock.txt -r requirements-desktop.lock.txt -r requirements-build.lock.txt

      - name: Verify CLI help output
        if: github.event_name == 'pull_request'
        run: python -m scripts.invoice_fetch --help

      - name: Run repository privacy gate
        if: github.event_name == 'pull_request'
        run: python scripts/check_repo_privacy.py

      - name: Run public export/source tree gate
        if: github.event_name == 'pull_request'
        run: python scripts/check_public_export.py .

      - name: Verify release metadata consistency
        if: github.event_name == 'pull_request'
        run: python scripts/check_release_metadata.py

      - name: Enforce architecture debt baseline
        if: github.event_name == 'pull_request'
        run: python scripts/check_architecture_policy.py

      - name: Compile-check Python sources
        if: github.event_name == 'pull_request'
        run: python -m compileall -q scripts/invoice_fetch

  unit_tests:
    name: Unit shard ${{ matrix.shard }}
    needs: master_ci_attestation
    if: ${{ always() && (github.event_name == 'pull_request' || needs.master_ci_attestation.result == 'success') }}
    runs-on: ${{ github.event_name == 'push' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      PYTHONIOENCODING: "utf-8"
      INVOICE_HUB_TEST_MODE: "1"

    steps:
      - name: Reuse the exact-tree unit shard from PR CI
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "Unit shard ${{ matrix.shard }} passed on the identical PR tree; see the Exact-master CI attestation job." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock.txt
            requirements-desktop.lock.txt
            requirements-build.lock.txt
            requirements-test.lock.txt

      - name: Install application and test dependencies
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.lock.txt -r requirements-desktop.lock.txt -r requirements-build.lock.txt -r requirements-test.lock.txt

      - name: Run isolated unit-test shard
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          python scripts/dev/run_isolated_unittest.py --exclude-dir tests/hci_acceptance --exclude-module tests.test_workbench_native_geometry --module-timeout-seconds 900 --shard-count 3 --shard-index ${{ matrix.shard }} 2>&1 | Tee-Object -FilePath ci-test-output-${{ matrix.shard }}.txt
          exit $LASTEXITCODE

      - name: Upload unit-test shard output
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-test-output-${{ matrix.shard }}
          path: ci-test-output-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 3

  hci_acceptance:
    name: HCI acceptance lane
    needs: master_ci_attestation
    if: ${{ always() && (github.event_name == 'pull_request' || needs.master_ci_attestation.result == 'success') }}
    runs-on: ${{ github.event_name == 'push' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: "utf-8"
      INVOICE_HUB_TEST_MODE: "1"
      HCI_ARTIFACT_DIR: artifacts/hci_acceptance

    steps:
      - name: Reuse the exact-tree HCI gate from PR CI
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "HCI acceptance passed on the identical PR tree; see the Exact-master CI attestation job." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock.txt
            requirements-desktop.lock.txt
            requirements-build.lock.txt
            requirements-test.lock.txt

      - name: Install application and test dependencies
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.lock.txt -r requirements-desktop.lock.txt -r requirements-build.lock.txt -r requirements-test.lock.txt

      - name: Run authoritative HCI acceptance
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          python scripts/dev/run_hci_acceptance.py 2>&1 | Tee-Object -FilePath hci-acceptance-output.txt
          $code = $LASTEXITCODE
          Write-Host "HCI authoritative exit code: $code"
          exit $code

      - name: Run HCI oracle contract tests
        if: always() && github.event_name == 'pull_request'
        run: python -m pytest -q tests/hci_acceptance/test_mutation_selftest.py tests/hci_acceptance/test_report_verdict.py

      - name: Upload HCI acceptance evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hci-acceptance-evidence
          path: |
            hci-acceptance-output.txt
            artifacts/hci_acceptance
          if-no-files-found: warn
          retention-days: 3

  native_geometry_preflight:
    name: Native GUI geometry preflight (non-gating)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: "utf-8"
      INVOICE_HUB_TEST_MODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock.txt
            requirements-desktop.lock.txt
            requirements-build.lock.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.lock.txt -r requirements-desktop.lock.txt -r requirements-build.lock.txt

      - name: Classify native GUI geometry
        id: native_geometry_classification
        shell: pwsh
        run: |
          python scripts/dev/check_native_gui_geometry.py 2>&1 | Tee-Object -FilePath native-geometry-preflight.txt
          $code = $LASTEXITCODE
          Write-Host "Native geometry preflight exit code: $code"
          exit $code

      - name: Run native workbench geometry tests
        if: steps.native_geometry_classification.outcome == 'success'
        shell: pwsh
        run: |
          python -m unittest -v tests.test_workbench_native_geometry 2>&1 | Tee-Object -FilePath native-workbench-geometry-tests.txt
          $code = $LASTEXITCODE
          Write-Host "Native workbench geometry test exit code: $code"
          exit $code

      - name: Upload native geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-geometry-preflight
          path: |
            native-geometry-preflight.txt
            native-workbench-geometry-tests.txt
          if-no-files-found: warn
          retention-days: 3
