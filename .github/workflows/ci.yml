name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source tree
    runs-on: windows-latest
    # The complete fresh-process suite currently needs more than 20 minutes
    # on Windows hosted runners.  Keep the full test set and allow the
    # following privacy/export/compile gates to run after it completes.
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: "utf-8"
      INVOICE_HUB_TEST_MODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.txt -r requirements-build.txt

      - name: Verify CLI help output
        run: python -m scripts.invoice_fetch --help

      - name: Run unit tests
        shell: pwsh
        run: |
          python scripts/dev/run_isolated_unittest.py --module-timeout-seconds 900 2>&1 | Tee-Object -FilePath ci-test-output.txt
          exit $LASTEXITCODE

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-test-output
          path: ci-test-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Run repository privacy gate
        run: python scripts/check_repo_privacy.py

      - name: Run public export/source tree gate
        run: python scripts/check_public_export.py .

      - name: Compile-check Python sources
        run: python -m compileall -q scripts/invoice_fetch
