name: Windows Build & Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character master SHA to audit before tagging"
        required: true
        type: string
      strict_startup_ms:
        description: "Strict startup gate threshold (ms)"
        required: false
        default: "3000"
        type: string

jobs:
  build:
    name: Build Windows x64 Package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: "utf-8"
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_REF: ${{ github.ref }}
      REQUESTED_CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
      REQUESTED_STARTUP_MS: ${{ github.event.inputs.strict_startup_ms }}
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_sha || github.ref }}
          fetch-depth: 0

      - name: Verify source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ($env:DISPATCH_REF -ne "refs/heads/master") {
              throw "Pre-tag release audit must be dispatched from master."
            }
            $expected = $env:REQUESTED_CANDIDATE_SHA.Trim().ToLowerInvariant()
            if ($expected -notmatch '^[0-9a-f]{40}$') {
              throw "candidate_sha must be a full 40-character commit SHA."
            }
            if ($actual -ne $expected) {
              throw "Checked out SHA $actual does not match requested candidate $expected."
            }
            git fetch --no-tags origin master --depth=1
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch origin/master for candidate identity verification."
            }
            $master = (git rev-parse FETCH_HEAD).Trim().ToLowerInvariant()
            if ($master -ne $expected) {
              throw "Audit candidate $expected is not exact origin/master ($master)."
            }
            "AUDIT_MODE=true" >> $env:GITHUB_ENV
          }
          else {
            $tag = $env:TAG_NAME
            $tagType = (git cat-file -t "refs/tags/$tag").Trim()
            if ($tagType -ne "tag") {
              throw "Release tag $tag must be annotated; found object type $tagType."
            }
            $tagCommit = (git rev-list -n 1 "refs/tags/$tag").Trim().ToLowerInvariant()
            if ($tagCommit -ne $actual) {
              throw "Release tag $tag resolves to $tagCommit but checkout is $actual."
            }
            "AUDIT_MODE=false" >> $env:GITHUB_ENV
          }
          "SOURCE_SHA=$actual" >> $env:GITHUB_ENV
          Write-Host "SOURCE_SHA=$actual"

      - name: Resolve startup threshold
        shell: pwsh
        run: |
          $thresh = $env:REQUESTED_STARTUP_MS
          if (-not $thresh) { $thresh = "3000" }
          if ($thresh -notmatch '^\d+$' -or [int]$thresh -le 0) {
            throw "strict_startup_ms must be a positive integer."
          }
          "STARTUP_THRESHOLD_MS=$thresh" >> $env:GITHUB_ENV
          Write-Host "STARTUP_THRESHOLD_MS=$thresh"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock.txt
            requirements-desktop.lock.txt
            requirements-build.lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.lock.txt -r requirements-desktop.lock.txt -r requirements-build.lock.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify CLI help output
        run: python -m scripts.invoice_fetch --help

      - name: Run isolated unit tests
        run: python scripts/dev/run_isolated_unittest.py --module-timeout-seconds 900
        env:
          INVOICE_HUB_TEST_MODE: "1"

      - name: Run repository privacy gate
        run: python scripts/check_repo_privacy.py

      - name: Run public export/source tree gate
        run: python scripts/check_public_export.py .

      - name: Verify release metadata consistency
        run: python scripts/check_release_metadata.py

      - name: Enforce architecture debt baseline
        run: python scripts/check_architecture_policy.py

      - name: Compile-check Python sources
        run: python -m compileall -q scripts/invoice_fetch

      - name: Generate Windows version metadata
        run: python -m scripts.generate_windows_version_info --output build/windows-version-info.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/invoice_hub_windows.spec --distpath dist --workpath build/pyinstaller --clean --noconfirm
        env:
          PYTHONOPTIMIZE: "1"

      - name: Verify executable exists
        run: |
          $exe = "dist\InvoiceHub\InvoiceHub.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build failed: $exe not found"
            exit 1
          }
          Write-Host "Build succeeded: $exe"
          Get-Item $exe | Select-Object Name, Length, LastWriteTime

      - name: Startup performance check
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "invoice-hub-portable-startup"
          Remove-Item -LiteralPath $runtimeDir -Recurse -Force -ErrorAction SilentlyContinue
          $env:INVOICE_HUB_RUNTIME_DIR = $runtimeDir
          try {
            python scripts/check_startup_time.py dist/InvoiceHub/InvoiceHub.exe --threshold $env:STARTUP_THRESHOLD_MS
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item Env:INVOICE_HUB_RUNTIME_DIR -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $runtimeDir -Recurse -Force -ErrorAction SilentlyContinue
          }
        timeout-minutes: 2

      - name: Sign portable executable
        run: '& scripts\sign_windows.ps1 "dist\InvoiceHub\InvoiceHub.exe"'

      - name: Prepare package version
        shell: pwsh
        run: |
          $sourceVersion = (python -c "from scripts.invoice_fetch.version import VERSION; print(VERSION)").Trim()
          if ($env:AUDIT_MODE -eq "true") {
            $version = $sourceVersion
            $artifactName = "InvoiceHub-windows-audit-$($env:SOURCE_SHA.Substring(0, 12))"
          }
          else {
            $tagVersion = $env:TAG_NAME -replace '/', '-'
            if ($tagVersion -notmatch '^v(?<base>\d+\.\d+\.\d+)(?<suffix>-(?:rc|pre)\d+)?$') {
              Write-Error "Tag $tagVersion must match vX.Y.Z or vX.Y.Z-rcN/vX.Y.Z-preN."
              exit 1
            }
            if ($Matches.base -ne $sourceVersion) {
              Write-Error "Tag base version $($Matches.base) does not match source version $sourceVersion."
              exit 1
            }
            $version = $tagVersion.Substring(1)
            $artifactName = "InvoiceHub-windows-release"
          }
          "VERSION=${version}" >> $env:GITHUB_ENV
          "ZIP_NAME=InvoiceHub-${version}-win64-portable.zip" >> $env:GITHUB_ENV
          "SETUP_NAME=InvoiceHub-${version}-win64-setup.exe" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=${artifactName}" >> $env:GITHUB_ENV
          Write-Host "AUDIT_MODE=$env:AUDIT_MODE VERSION=$version ARTIFACT_NAME=$artifactName"

      - name: Verify bundled payload hygiene
        run: |
          $required = @(
            "dist\InvoiceHub\LICENSE",
            "dist\InvoiceHub\THIRD_PARTY_NOTICES.md",
            "dist\InvoiceHub\licenses\LGPL-3.0.txt",
            "dist\InvoiceHub\licenses\GPL-3.0.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Release payload missing required notice file: $path"
              exit 1
            }
          }
          $bad = Get-ChildItem dist\InvoiceHub -Recurse -Force | Where-Object {
            $path = $_.FullName
            $name = $_.Name
            $path -match '[\\/](runtime|private-data|real-samples|ms-playwright)[\\/]' -or
              $path -match '[\\/]chromium-[^\\/]+[\\/]' -or
              $name -in @("config.json", "invoices.db")
          }
          if ($bad) {
            $bad | Select-Object FullName
            Write-Error "Release payload contains forbidden runtime/private/browser files."
            exit 1
          }

      - name: Create portable zip
        run: |
          $version = "${env:VERSION}"
          $zipName = "InvoiceHub-${version}-win64-portable.zip"
          Compress-Archive -Path "dist\InvoiceHub\*" -DestinationPath "dist\${zipName}" -Force
          Write-Host "Created: dist\${zipName}"

      - name: Generate installer ownership data
        run: |
          python scripts\dev\generate_installer_ownership.py include --current-dir dist\InvoiceHub --legacy-manifest packaging\legacy\v0.1.5-rc1-files.txt --legacy-manifest packaging\legacy\v0.1.5-rc2-files.txt --output packaging\legacy\installer_ownership.issinc --current-manifest-output build\current-installer-files.txt
          if (-not (Test-Path "packaging\legacy\installer_ownership.issinc")) {
            Write-Error "Installer ownership include was not generated."
            exit 1
          }
          Get-Item "packaging\legacy\installer_ownership.issinc", "build\current-installer-files.txt" | Select-Object Name, Length

      - name: Build Inno Setup installer
        run: |
          $version = "${env:VERSION}"
          $sourceDir = (Resolve-Path "dist\InvoiceHub").Path
          $outputDir = (Resolve-Path "dist").Path
          iscc packaging\invoice_hub_windows.iss /DAppVersion="${version}" /DSourceDir="${sourceDir}" /DOutputDir="${outputDir}"

      - name: Verify installer lifecycle ownership recovery
        run: |
          $isccPath = (Get-Command iscc -CommandType Application -ErrorAction Stop).Source
          if (-not $isccPath) {
            throw "Inno Setup compiler was not resolved from PATH."
          }
          Write-Host "Using Inno Setup compiler: $isccPath"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\dev\verify_installer_lifecycle.ps1 -IsccPath $isccPath -InstallRoot $env:TEMP

      - name: Sign installer
        run: '& scripts\sign_windows.ps1 "dist\${env:SETUP_NAME}"'

      - name: Verify real installer install startup uninstall
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\dev\verify_release_install.ps1 -SetupPath "dist\${env:SETUP_NAME}" -SourceExePath "dist\InvoiceHub\InvoiceHub.exe" -ExpectedVersion "${env:VERSION}" -StartupThresholdMs $env:STARTUP_THRESHOLD_MS -EvidenceDir "build\release-install-smoke"
        timeout-minutes: 5

      - name: Upload real installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-install-smoke-${{ github.sha }}
          path: build/release-install-smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Create checksums
        run: |
          $version = "${env:VERSION}"
          $artifacts = @(
            "dist\InvoiceHub-${version}-win64-portable.zip",
            "dist\InvoiceHub-${version}-win64-setup.exe"
          )
          $lines = foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact)) {
              Write-Error "Missing release artifact: $artifact"
              exit 1
            }
            $hash = Get-FileHash $artifact -Algorithm SHA256
            "$($hash.Hash.ToLower())  $(Split-Path $artifact -Leaf)"
          }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Verify release artifacts
        run: |
          $version = "${env:VERSION}"
          $expected = @(
            "dist\InvoiceHub-${version}-win64-portable.zip",
            "dist\InvoiceHub-${version}-win64-setup.exe",
            "dist\SHA256SUMS.txt"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) {
              Write-Error "Expected artifact missing: $path"
              exit 1
            }
          }

      - name: Reconfirm audit candidate is still master
        shell: pwsh
        run: |
          if ($env:AUDIT_MODE -ne "true") {
            Write-Host "Tag build: exact-master recheck is not applicable."
            exit 0
          }
          git fetch --no-tags origin master --depth=1
          if ($LASTEXITCODE -ne 0) {
            throw "Could not refetch origin/master before audit artifact upload."
          }
          $master = (git rev-parse FETCH_HEAD).Trim().ToLowerInvariant()
          if ($master -ne $env:SOURCE_SHA) {
            throw "origin/master moved to $master during audit; evidence for $env:SOURCE_SHA is stale and must not be used for GO."
          }
          Write-Host "Exact-master identity reconfirmed: $master"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.SETUP_NAME }}
            dist/SHA256SUMS.txt
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: InvoiceHub-windows-release
          path: dist

      - name: Prepare release version
        shell: pwsh
        run: |
          $version = $env:TAG_NAME
          $version = $version.Substring(1)
          "VERSION=${version}" >> $env:GITHUB_ENV
          "ZIP_NAME=InvoiceHub-${version}-win64-portable.zip" >> $env:GITHUB_ENV
          "SETUP_NAME=InvoiceHub-${version}-win64-setup.exe" >> $env:GITHUB_ENV
          if (-not (Test-Path "dist\InvoiceHub-${version}-win64-portable.zip") -or -not (Test-Path "dist\InvoiceHub-${version}-win64-setup.exe") -or -not (Test-Path "dist\SHA256SUMS.txt")) {
            Write-Error "Downloaded release artifacts are incomplete."
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Invoice Hub ${{ env.VERSION }}"
          body: |
            ## Invoice Hub ${{ env.VERSION }} - Windows x64

            Release artifacts:
            - `${{ env.SETUP_NAME }}`: per-user installer, no administrator permission required.
            - `${{ env.ZIP_NAME }}`: portable onedir package.
            - `SHA256SUMS.txt`: SHA256 checksums for both artifacts.

            Download only from the official GitHub Releases page and verify SHA256 before installing.
            SmartScreen or Unknown Publisher prompts can appear for unsigned builds with little download reputation; that is expected until trusted Authenticode signing is in place.
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.SETUP_NAME }}
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
