name: Windows Build & Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      strict_startup_ms:
        description: "Strict startup gate threshold (ms)"
        required: false
        default: "3000"

jobs:
  build:
    name: Build Windows x64 Package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.txt -r requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Verify CLI help output
        run: python -m scripts.invoice_fetch --help

      - name: Run unit tests
        run: python -m unittest discover -v -s tests -p "test_*.py"
        env:
          INVOICE_HUB_TEST_MODE: "1"

      - name: Run repository privacy gate
        run: python scripts/check_repo_privacy.py

      - name: Run public export/source tree gate
        run: python scripts/check_public_export.py .

      - name: Compile-check Python sources
        run: python -m compileall -q scripts/invoice_fetch

      - name: Generate Windows version metadata
        run: python -m scripts.generate_windows_version_info --output build/windows-version-info.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/invoice_hub_windows.spec --distpath dist --workpath build/pyinstaller --clean --noconfirm
        env:
          PYTHONOPTIMIZE: "1"

      - name: Verify executable exists
        run: |
          $exe = "dist\InvoiceHub\InvoiceHub.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build failed: $exe not found"
            exit 1
          }
          Write-Host "Build succeeded: $exe"
          Get-Item $exe | Select-Object Name, Length, LastWriteTime

      - name: Startup performance check
        run: |
          $thresh = "${{ github.event.inputs.strict_startup_ms }}"
          if (-not $thresh) { $thresh = "3000" }
          python scripts/check_startup_time.py dist/InvoiceHub/InvoiceHub.exe --threshold $thresh
        timeout-minutes: 2

      - name: Sign portable executable
        run: '& scripts\sign_windows.ps1 "dist\InvoiceHub\InvoiceHub.exe"'

      - name: Prepare release version
        run: |
          $sourceVersion = (python -c "from scripts.invoice_fetch.version import VERSION; print(VERSION)").Trim()
          $tagVersion = "${{ github.ref_name }}" -replace '/', '-'
          if ($tagVersion -notmatch '^v(?<base>\d+\.\d+\.\d+)(?<suffix>-(?:rc|pre)\d+)?$') {
            Write-Error "Tag $tagVersion must match vX.Y.Z or vX.Y.Z-rcN/vX.Y.Z-preN."
            exit 1
          }
          if ($Matches.base -ne $sourceVersion) {
            Write-Error "Tag base version $($Matches.base) does not match source version $sourceVersion."
            exit 1
          }
          $version = $tagVersion.Substring(1)
          echo "VERSION=${version}" >> $env:GITHUB_ENV
          echo "ZIP_NAME=InvoiceHub-${version}-win64-portable.zip" >> $env:GITHUB_ENV
          echo "SETUP_NAME=InvoiceHub-${version}-win64-setup.exe" >> $env:GITHUB_ENV

      - name: Verify bundled payload hygiene
        run: |
          $required = @(
            "dist\InvoiceHub\LICENSE",
            "dist\InvoiceHub\THIRD_PARTY_NOTICES.md",
            "dist\InvoiceHub\licenses\LGPL-3.0.txt",
            "dist\InvoiceHub\licenses\GPL-3.0.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Release payload missing required notice file: $path"
              exit 1
            }
          }
          $bad = Get-ChildItem dist\InvoiceHub -Recurse -Force | Where-Object {
            $path = $_.FullName
            $name = $_.Name
            $path -match '[\\/](runtime|private-data|real-samples|ms-playwright)[\\/]' -or
              $path -match '[\\/]chromium-[^\\/]+[\\/]' -or
              $name -in @("config.json", "invoices.db")
          }
          if ($bad) {
            $bad | Select-Object FullName
            Write-Error "Release payload contains forbidden runtime/private/browser files."
            exit 1
          }

      - name: Create portable zip
        run: |
          $version = "${env:VERSION}"
          $zipName = "InvoiceHub-${version}-win64-portable.zip"
          Compress-Archive -Path "dist\InvoiceHub\*" -DestinationPath "dist\${zipName}" -Force
          Write-Host "Created: dist\${zipName}"

      - name: Generate installer ownership data
        run: |
          python scripts\dev\generate_installer_ownership.py include --current-dir dist\InvoiceHub --legacy-manifest packaging\legacy\v0.1.5-rc1-files.txt --legacy-manifest packaging\legacy\v0.1.5-rc2-files.txt --output packaging\legacy\installer_ownership.issinc --current-manifest-output build\current-installer-files.txt
          if (-not (Test-Path "packaging\legacy\installer_ownership.issinc")) {
            Write-Error "Installer ownership include was not generated."
            exit 1
          }
          Get-Item "packaging\legacy\installer_ownership.issinc", "build\current-installer-files.txt" | Select-Object Name, Length

      - name: Build Inno Setup installer
        run: |
          $version = "${env:VERSION}"
          $sourceDir = (Resolve-Path "dist\InvoiceHub").Path
          $outputDir = (Resolve-Path "dist").Path
          iscc packaging\invoice_hub_windows.iss /DAppVersion="${version}" /DSourceDir="${sourceDir}" /DOutputDir="${outputDir}"

      - name: Verify installer lifecycle ownership recovery
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\dev\verify_installer_lifecycle.ps1 -InstallRoot $env:TEMP

      - name: Sign installer
        run: '& scripts\sign_windows.ps1 "dist\${env:SETUP_NAME}"'

      - name: Create checksums
        run: |
          $version = "${env:VERSION}"
          $artifacts = @(
            "dist\InvoiceHub-${version}-win64-portable.zip",
            "dist\InvoiceHub-${version}-win64-setup.exe"
          )
          $lines = foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact)) {
              Write-Error "Missing release artifact: $artifact"
              exit 1
            }
            $hash = Get-FileHash $artifact -Algorithm SHA256
            "$($hash.Hash.ToLower())  $(Split-Path $artifact -Leaf)"
          }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Verify release artifacts
        run: |
          $version = "${env:VERSION}"
          $expected = @(
            "dist\InvoiceHub-${version}-win64-portable.zip",
            "dist\InvoiceHub-${version}-win64-setup.exe",
            "dist\SHA256SUMS.txt"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) {
              Write-Error "Expected artifact missing: $path"
              exit 1
            }
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceHub-windows-release
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.SETUP_NAME }}
            dist/SHA256SUMS.txt
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: InvoiceHub-windows-release
          path: dist

      - name: Prepare release version
        run: |
          $version = "${{ github.ref_name }}"
          $version = $version.Substring(1)
          echo "VERSION=${version}" >> $env:GITHUB_ENV
          echo "ZIP_NAME=InvoiceHub-${version}-win64-portable.zip" >> $env:GITHUB_ENV
          echo "SETUP_NAME=InvoiceHub-${version}-win64-setup.exe" >> $env:GITHUB_ENV
          if (-not (Test-Path "dist\InvoiceHub-${version}-win64-portable.zip") -or -not (Test-Path "dist\InvoiceHub-${version}-win64-setup.exe") -or -not (Test-Path "dist\SHA256SUMS.txt")) {
            Write-Error "Downloaded release artifacts are incomplete."
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Invoice Hub ${{ env.VERSION }}"
          body: |
            ## Invoice Hub ${{ env.VERSION }} - Windows x64

            Release artifacts:
            - `${{ env.SETUP_NAME }}`: per-user installer, no administrator permission required.
            - `${{ env.ZIP_NAME }}`: portable onedir package.
            - `SHA256SUMS.txt`: SHA256 checksums for both artifacts.

            Download only from the official GitHub Releases page and verify SHA256 before installing.
            SmartScreen or Unknown Publisher prompts can appear for unsigned builds with little download reputation; that is expected until trusted Authenticode signing is in place.
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.SETUP_NAME }}
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
