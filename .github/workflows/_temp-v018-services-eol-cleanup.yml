name: Temporary v0.1.8 Services EOL Cleanup

on:
  push:
    branches:
      - fix/v018-mail-scan-bounded-browser

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-mail-scan-bounded-browser
          fetch-depth: 0

      - name: Restore untouched services tail byte-for-byte from master
        shell: bash
        run: |
          git fetch origin master
          git show origin/master:scripts/invoice_fetch/services.py > /tmp/services-master.py
          python - <<'PY'
          from pathlib import Path

          branch_path = Path('scripts/invoice_fetch/services.py')
          branch = branch_path.read_bytes()
          master = Path('/tmp/services-master.py').read_bytes()
          marker = b'def import_local_directory('
          branch_pos = branch.index(marker)
          master_pos = master.index(marker)
          branch_path.write_bytes(branch[:branch_pos] + master[master_pos:])
          PY
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_temp-v018-services-eol-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "chore: restore untouched services line endings"
          git push origin HEAD:fix/v018-mail-scan-bounded-browser
