name: Temporary v0.1.8 Scan Shutdown Fix

on:
  push:
    branches:
      - fix/v018-mail-scan-bounded-browser

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-mail-scan-bounded-browser
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply production and regression patch
        shell: bash
        run: |
          python scripts/dev/_apply_v018_scan_shutdown_fix.py
          python - <<'PY'
          from pathlib import Path

          runtime_test = Path('tests/test_runtime_safety.py')
          with runtime_test.open('r', encoding='utf-8', newline='') as fh:
              text = fh.read()
          if 'import time\n' not in text and 'import time\r\n' not in text:
              if 'import tempfile\nimport unittest\n' in text:
                  text = text.replace('import tempfile\nimport unittest\n', 'import tempfile\nimport time\nimport unittest\n', 1)
              elif 'import tempfile\r\nimport unittest\r\n' in text:
                  text = text.replace('import tempfile\r\nimport unittest\r\n', 'import tempfile\r\nimport time\r\nimport unittest\r\n', 1)
              else:
                  raise SystemExit('runtime safety import anchor not found')
              with runtime_test.open('w', encoding='utf-8', newline='') as fh:
                  fh.write(text)

          bounded_test = Path('tests/test_mail_scan_bounded_browser.py')
          text = bounded_test.read_text(encoding='utf-8')
          old = 'source = inspect.getsource(services.scan_email_and_download)'
          new = 'source = inspect.getsource(services._scan_mailboxes_with_db)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('mail scan service source assertion anchor not found')

          old_settings = '''    def test_settings_rule_does_not_claim_a_fixed_three_month_window(self):\n        from scripts.invoice_fetch.gui import settings_dialog\n\n        source = inspect.getsource(settings_dialog.SettingsDialog)\n        self.assertNotIn("只扫描最近 3 个月", source)\n        self.assertIn("按各邮箱配置的时间范围进行增量抓取", source)\n'''
          new_settings = '''    def test_settings_rule_does_not_claim_a_fixed_three_month_window(self):\n        source = Path("scripts/invoice_fetch/gui/settings_dialog.py").read_text(encoding="utf-8")\n        self.assertNotIn("只扫描最近 3 个月", source)\n        self.assertIn("按各邮箱配置的时间范围进行增量抓取", source)\n'''
          if old_settings in text:
              text = text.replace(old_settings, new_settings, 1)
          elif new_settings not in text:
              raise SystemExit('settings text test anchor not found')
          bounded_test.write_text(text, encoding='utf-8')
          PY

      - name: Install focused test dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Validate focused closure
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m py_compile \
            scripts/invoice_fetch/link_downloader.py \
            scripts/invoice_fetch/services.py \
            scripts/invoice_fetch/gui/app.py \
            tests/test_mail_scan_bounded_browser.py \
            tests/test_runtime_safety.py
          python -m unittest -v tests.test_mail_scan_bounded_browser
          python -m unittest -v tests.test_runtime_safety.WorkerShutdownTests
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit closure and remove temporary scaffolding
        shell: bash
        run: |
          rm -f scripts/dev/_apply_v018_scan_shutdown_fix.py
          rm -f .github/workflows/_temp-v018-scan-shutdown-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "fix: keep shutdown responsive during active scans"
          git push origin HEAD:fix/v018-mail-scan-bounded-browser
