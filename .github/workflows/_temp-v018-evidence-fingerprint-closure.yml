name: Temporary v0.1.8 Evidence Fingerprint Closure

on:
  push:
    branches:
      - fix/v018-mail-scan-bounded-browser

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-mail-scan-bounded-browser
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply full-document bounded evidence fingerprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/invoice_fetch/services.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def _semantic_evidence_fingerprint(path: str | Path) -> str:\n')
          end = text.index('\ndef _attach_evidence_to_invoice(', start)
          replacement = (
              'def _semantic_evidence_fingerprint(path: str | Path) -> str:\n'
              '    """Return a stable full-document visible-text fingerprint for small PDFs."""\n'
              '    p = Path(path)\n'
              '    if not p.exists() or p.suffix.lower() != ".pdf":\n'
              '        return ""\n'
              '    try:\n'
              '        import pdfplumber\n'
              '        with pdfplumber.open(str(p)) as pdf:\n'
              '            # Semantic dedup must never ignore later pages.  For unusually\n'
              '            # long documents, fail open to byte/path dedup instead of risking\n'
              '            # a false duplicate while doing expensive full-document parsing.\n'
              '            if not pdf.pages or len(pdf.pages) > 32:\n'
              '                return ""\n'
              '            parts: list[str] = []\n'
              '            for page in pdf.pages:\n'
              '                page_text = page.extract_text()\n'
              '                if page_text:\n'
              '                    parts.append(page_text)\n'
              '            visible_text = "\\n".join(parts)\n'
              '    except Exception:\n'
              '        return ""\n'
              '    visible_text = visible_text.replace("\\u2f26", "月").replace("\\u2f49", "月")\n'
              '    visible_text = visible_text.replace("\\u2f3c", "日").replace("\\u2f47", "日").replace("\\u2f52", "日")\n'
              '    normalized = re.sub(r"\\s+", " ", str(visible_text or "")).strip().casefold()\n'
              '    if len(normalized) < 32:\n'
              '        return ""\n'
              '    digest = hashlib.sha256(normalized.encode("utf-8", errors="ignore")).hexdigest()\n'
              '    return f"pdftext:{digest}"\n\n'
          )
          text = text[:start] + replacement + text[end + 1:]
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/invoice_fetch/services.py
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit closure and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_temp-v018-evidence-fingerprint-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "fix: make evidence semantic dedup full-document safe"
          git push origin HEAD:fix/v018-mail-scan-bounded-browser
