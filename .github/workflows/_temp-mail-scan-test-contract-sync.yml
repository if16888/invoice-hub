name: Temporary Mail Scan Test Contract Sync

on:
  push:
    branches:
      - fix/v018-mail-scan-bounded-browser

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: "utf-8"
      INVOICE_HUB_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-mail-scan-bounded-browser
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock.txt
            requirements-desktop.lock.txt
            requirements-build.lock.txt
            requirements-test.lock.txt

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.lock.txt -r requirements-desktop.lock.txt -r requirements-build.lock.txt -r requirements-test.lock.txt

      - name: Apply test-contract sync
        run: python scripts/dev/_apply_mail_scan_test_contract_sync.py

      - name: Focused validation
        shell: pwsh
        run: |
          python -m py_compile tests/test_link_downloader.py tests/test_invoice_workflow.py
          python -m unittest -v tests.test_link_downloader tests.test_invoice_workflow tests.test_mail_scan_bounded_browser tests.test_runtime_safety.WorkerShutdownTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit test sync and remove temporary scaffolding
        shell: pwsh
        run: |
          Remove-Item scripts/dev/_apply_mail_scan_test_contract_sync.py -Force
          Remove-Item .github/workflows/_temp-mail-scan-test-contract-sync.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test: sync mail scan deadline contract"
          git push origin HEAD:fix/v018-mail-scan-bounded-browser
