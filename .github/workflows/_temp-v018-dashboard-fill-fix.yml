name: temp v0.1.8 dashboard fill correction

on:
  push:
    branches:
      - fix/v018-post-merge-ux-regressions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-post-merge-ux-regressions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused correction
        shell: pwsh
        run: python scripts/dev/_apply_v018_dashboard_fill_fix.py

      - name: Install focused GUI test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-input --prefer-binary --no-compile -r requirements.lock.txt -r requirements-desktop.lock.txt -r requirements-test.lock.txt

      - name: Run focused regression tests
        shell: pwsh
        env:
          INVOICE_HUB_TEST_MODE: '1'
        run: |
          python -m unittest -v tests.test_v018_post_merge_ux_regressions
          git diff --check

      - name: Remove temporary automation files
        shell: pwsh
        run: |
          Remove-Item scripts/dev/_apply_v018_dashboard_fill_fix.py -Force
          Remove-Item .github/workflows/_temp-v018-dashboard-fill-fix.yml -Force

      - name: Commit production correction
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: let dashboard fill wide client area"
          git push origin HEAD:fix/v018-post-merge-ux-regressions
