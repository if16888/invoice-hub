name: Self-hosted Linux PySide6 probe

permissions:
  contents: read

on:
  push:
    branches:
      - test/selfhosted-linux-pyside6-probe

concurrency:
  group: selfhosted-linux-pyside6-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Linux self-hosted PySide6 probe
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TMPDIR: /var/tmp/actions-invoice-hub
      TMP: /var/tmp/actions-invoice-hub
      TEMP: /var/tmp/actions-invoice-hub
      QT_QPA_PLATFORM: offscreen
      INVOICE_HUB_TEST_MODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository without deleting probe cache
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Host and temp preflight
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          python --version
          python -m pip --version
          python - <<'PY'
          import tempfile
          print('python tempfile =', tempfile.gettempdir())
          assert tempfile.gettempdir() == '/var/tmp/actions-invoice-hub'
          PY
          df -h / /tmp /var/tmp/actions-invoice-hub
          free -h
          test -w /var/tmp/actions-invoice-hub

      - name: Reuse or install locked PySide6 probe venv
        shell: bash
        run: |
          set -euxo pipefail
          if [ -x .venv-selfhosted-probe/bin/python ] && \
             .venv-selfhosted-probe/bin/python -c 'import PySide6; assert PySide6.__version__ == "6.11.1"' 2>/dev/null; then
            echo 'Reusing existing PySide6 probe venv'
          else
            rm -rf .venv-selfhosted-probe
            python -m venv .venv-selfhosted-probe
            source .venv-selfhosted-probe/bin/activate
            python -m pip install --upgrade pip
            python -m pip install --no-cache-dir -r requirements-desktop.lock.txt
          fi
          .venv-selfhosted-probe/bin/python - <<'PY'
          import PySide6
          from PySide6.QtCore import qVersion
          print('PySide6 =', PySide6.__version__)
          print('Qt =', qVersion())
          print('PYSIDE6_IMPORT=PASS')
          PY

      - name: Audit Qt shared-library dependencies
        shell: bash
        run: |
          set -euxo pipefail
          QT_WIDGETS=$(find .venv-selfhosted-probe/lib -path '*/site-packages/PySide6/QtWidgets*.so' -print -quit)
          echo "QtWidgets module: $QT_WIDGETS"
          test -n "$QT_WIDGETS"
          ldd "$QT_WIDGETS" | tee qtwidgets-ldd.txt
          echo '=== missing shared libraries ==='
          grep 'not found' qtwidgets-ldd.txt || true

      - name: Run Qt offscreen lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          source .venv-selfhosted-probe/bin/activate
          python - <<'PY'
          from PySide6.QtWidgets import QApplication, QWidget
          app = QApplication([])
          widget = QWidget()
          widget.resize(640, 480)
          widget.show()
          app.processEvents()
          assert widget.width() == 640
          assert widget.height() == 480
          widget.close()
          app.processEvents()
          print('QT_OFFSCREEN_LIFECYCLE=PASS')
          PY

      - name: Run lightweight repository checks
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/check_release_metadata.py
          python scripts/check_architecture_policy.py
          python -m compileall -q scripts/invoice_fetch
          echo 'LIGHTWEIGHT_REPOSITORY_CHECKS=PASS'

      - name: Resource snapshot
        if: always()
        shell: bash
        run: |
          echo '=== memory ==='
          free -h || true
          echo '=== filesystems ==='
          df -h / /tmp /var/tmp/actions-invoice-hub || true
          echo '=== probe venv ==='
          du -sh .venv-selfhosted-probe 2>/dev/null || true
          echo '=== kernel OOM evidence ==='
          dmesg 2>/dev/null | tail -n 80 | grep -Ei 'oom|out of memory|killed process' || true
