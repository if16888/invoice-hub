name: Windows Baseline-first Startup Diagnostic

on:
  push:
    branches:
      - diagnostics/windows-startup-ab-ca358f9

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout exact source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build historical B and observe its first desktop startup twice
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ih-ab-$env:GITHUB_RUN_ATTEMPT"
          python scripts/dev/windows_startup_ab.py --output-dir "$output" --baseline-first --native-qt
          exit $LASTEXITCODE

      - name: Upload compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-startup-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ih-ab-${{ github.run_attempt }}/evidence
          if-no-files-found: warn
          retention-days: 3
