name: temp v0.1.8 post-merge UX regression closure

on:
  push:
    branches:
      - fix/v018-post-merge-ux-regressions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-post-merge-ux-regressions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused production patch
        shell: pwsh
        run: python scripts/dev/_apply_v018_post_merge_ux_regressions.py

      - name: Static syntax and diff checks
        shell: pwsh
        run: |
          python -m py_compile scripts/invoice_fetch/gui/app.py scripts/invoice_fetch/gui/hci_v1.py scripts/invoice_fetch/gui/mobile_upload_session.py tests/test_v018_post_merge_ux_regressions.py
          git diff --check

      - name: Remove temporary automation files
        shell: pwsh
        run: |
          Remove-Item scripts/dev/_apply_v018_post_merge_ux_regressions.py -Force
          Remove-Item .github/workflows/_temp-v018-post-merge-ux-regressions.yml -Force

      - name: Commit production changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close v0.1.8 post-merge UX regressions"
          git push origin HEAD:fix/v018-post-merge-ux-regressions
