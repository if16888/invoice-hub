name: Temporary Mail Scan Guard Patcher

on:
  push:
    branches:
      - fix/v018-mail-scan-bounded-browser

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-mail-scan-bounded-browser
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize complex browser patcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/dev/_apply_mail_scan_guard_patch.py')
          text = p.read_text(encoding='utf-8')

          old = 'if text.count(needle) != 2:\n    raise RuntimeError(f"{link}: expected two browser attempt call sites, found {text.count(needle)}")'
          new = 'if text.count(needle) < 1:\n    raise RuntimeError(f"{link}: expected at least one browser attempt call site, found {text.count(needle)}")'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('browser attempt precondition block not found')

          start_marker = "replace_once(\n    link,\n    '''            if not downloaded_path:\\n                page.wait_for_timeout(2000)\\n                if not downloaded_path:\\n'''"
          start = text.find(start_marker)
          if start != -1:
              next_marker = "\nreplace_once(\n    link,\n    '''        except Exception as exc:"
              end = text.find(next_marker, start)
              if end == -1:
                  raise SystemExit('could not find end of general-wait patch block')
              text = text[:start] + text[end + 1:]

          simple_marker = '# 3) Wire the active scan cancellation token into browser link downloads.'
          simple_start = text.find(simple_marker)
          if simple_start == -1:
              raise SystemExit('simple edit marker not found')
          text = text[:simple_start] + 'print("bounded browser core patch applied")\n'

          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply bounded-browser core patch
        run: python scripts/dev/_apply_mail_scan_guard_patch.py

      - name: Apply simple scan and UI edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              with p.open('r', encoding='utf-8', newline='') as fh:
                  text = fh.read()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old!r}')
              with p.open('w', encoding='utf-8', newline='') as fh:
                  fh.write(text.replace(old, new, expected))

          replace_exact(
              'scripts/invoice_fetch/services.py',
              'LinkDownloader(att_dir, headed=headed)',
              'LinkDownloader(att_dir, headed=headed, scan_control=scan_control)',
          )
          settings_path = Path('scripts/invoice_fetch/gui/settings_dialog.py')
          replace_exact(
              settings_path,
              '📅 扫描时间范围: 只扫描最近 3 个月内的增量发票邮件',
              '📅 扫描时间范围: 按各邮箱配置的时间范围进行增量抓取',
          )
          with settings_path.open('r', encoding='utf-8', newline='') as fh:
              settings_text = fh.read()
          cleaned = []
          target = '按各邮箱配置的时间范围进行增量抓取'
          for line in settings_text.splitlines(keepends=True):
              if target in line:
                  if line.endswith('\r\n'):
                      line = line[:-2].rstrip(' \t') + '\r\n'
                  elif line.endswith('\n'):
                      line = line[:-1].rstrip(' \t') + '\n'
                  else:
                      line = line.rstrip(' \t')
              cleaned.append(line)
          with settings_path.open('w', encoding='utf-8', newline='') as fh:
              fh.write(''.join(cleaned))

          replace_exact(
              'config.example.json',
              '    "timeout_ms": 10000,\n    "max_links_per_email": 5,',
              '    "timeout_ms": 10000,\n    "max_operation_timeout_ms": 10000,\n    "max_seconds_per_url": 20,\n    "max_seconds_per_email": 60,\n    "max_links_per_email": 3,',
          )
          PY

      - name: Static validation
        run: |
          python -m py_compile \
            scripts/invoice_fetch/link_downloader.py \
            scripts/invoice_fetch/services.py \
            scripts/invoice_fetch/gui/settings_dialog.py \
            tests/test_mail_scan_bounded_browser.py
          python -m json.tool config.example.json > /dev/null
          git diff --check

      - name: Commit production patch and remove temporary patcher
        shell: bash
        run: |
          rm -f scripts/dev/_apply_mail_scan_guard_patch.py
          rm -f .github/workflows/_temp-mail-scan-guard-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bound browser work during mailbox scans"
          git push origin HEAD:fix/v018-mail-scan-bounded-browser
