name: Apply targeted CI fix

on:
  push:
    branches:
      - agent/ui-stabilization-real-workflow
    paths:
      - ".github/workflows/apply-ci-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-stabilization-real-workflow
          fetch-depth: 0

      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "scripts/invoice_fetch/gui/review_toolbar_filter_fixes.py": [
                  (
                      '    scan_action = getattr(window, "action_scan_email", None)\n'
                      '    if scan_action is not None:\n'
                      '        # Preserve the established More-menu text contract while making the\n'
                      '        # operation explicit through the visible toolbar and tooltip.\n'
                      '        scan_action.setToolTip("扫描已配置邮箱中的新发票")\n',
                      '    scan_action = getattr(window, "action_scan_email", None)\n'
                      '    if scan_action is not None:\n'
                      '        scan_action.setText("扫描邮箱")\n'
                      '        scan_action.setToolTip("扫描已配置邮箱中的新发票")\n',
                  ),
                  (
                      '        card.setSizePolicy(QSizePolicy.Fixed, QSizePolicy.Fixed)\n',
                      '        card.setSizePolicy(QSizePolicy.Preferred, QSizePolicy.Fixed)\n',
                  ),
                  (
                      '        window._min_column_widths[INVOICE_NUMBER_COLUMN] = 160\n',
                      '        window._min_column_widths[INVOICE_NUMBER_COLUMN] = 178\n',
                  ),
              ],
              "scripts/invoice_fetch/gui/review_table_width_contract.py": [
                  (
                      'INVOICE_NUMBER_MIN_WIDTH = 160\n',
                      'INVOICE_NUMBER_MIN_WIDTH = 178\n',
                  ),
              ],
              "tests/test_claim_groups.py": [
                  (
                      '                        "邮箱同步",\n',
                      '                        "扫描邮箱",\n',
                  ),
                  (
                      '                        ["本地文件导入", "扫码上传", "邮箱导入"],\n',
                      '                        ["本地文件", "手机上传", "邮箱扫描"],\n',
                  ),
              ],
              "tests/test_workbench_layout.py": [
                  (
                      '                self.assertEqual(window.btn_scan_email.text(), "同步")\n',
                      '                self.assertEqual(window.btn_scan_email.text(), "扫描邮箱")\n',
                  ),
              ],
              "tests/test_review_toolbar_filter_fixes.py": [
                  (
                      '                self.assertEqual(window.btn_scan_email.text(), "扫描邮箱")\n',
                      '                self.assertEqual(window.btn_scan_email.text(), "扫描邮箱")\n'
                      '                self.assertEqual(window.action_scan_email.text(), "扫描邮箱")\n',
                  ),
                  (
                      '                self.assertEqual(window._min_column_widths[5], 160)\n',
                      '                self.assertEqual(window._min_column_widths[5], 178)\n',
                  ),
              ],
          }

          for relative_path, edits in replacements.items():
              path = Path(relative_path)
              text = path.read_text(encoding="utf-8-sig")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{relative_path}: expected exactly one match for {old!r}, found {count}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/apply-ci-fix.yml").unlink()

      - name: Compile-check changed Python files
        run: >-
          python -m py_compile
          scripts/invoice_fetch/gui/review_toolbar_filter_fixes.py
          scripts/invoice_fetch/gui/review_table_width_contract.py
          tests/test_claim_groups.py
          tests/test_workbench_layout.py
          tests/test_review_toolbar_filter_fixes.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/invoice_fetch/gui/review_toolbar_filter_fixes.py \
                  scripts/invoice_fetch/gui/review_table_width_contract.py \
                  tests/test_claim_groups.py \
                  tests/test_workbench_layout.py \
                  tests/test_review_toolbar_filter_fixes.py \
                  .github/workflows/apply-ci-fix.yml
          git commit -m "fix(gui): align review contracts and CI assertions"
          git push origin HEAD:agent/ui-stabilization-real-workflow
