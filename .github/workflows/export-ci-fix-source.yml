name: Export source for CI fix

on:
  pull_request:
    paths:
      - ".github/workflows/export-ci-fix-source.yml"
      - "tests/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload source files
        uses: actions/upload-artifact@v4
        with:
          name: ci-fix-source
          path: |
            tests/test_claim_groups.py
            tests/test_gui_column_filters.py
            tests/test_workbench_layout.py
            tests/test_review_toolbar_filter_fixes.py
            scripts/invoice_fetch/gui/review_toolbar_filter_fixes.py
            scripts/invoice_fetch/gui/review_table_width_contract.py
          retention-days: 1
