name: Temporary v0.1.8 DNS Slot Closure

on:
  push:
    branches:
      - fix/v018-mail-scan-bounded-browser

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v018-mail-scan-bounded-browser
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependency
        shell: bash
        run: python -m pip install beautifulsoup4

      - name: Apply bounded DNS resolver capacity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/invoice_fetch/link_downloader.py')
          text = p.read_text(encoding='utf-8')
          old = '_DNS_RESOLVE_TIMEOUT_SECONDS = 2.0\n\n\n@lru_cache(maxsize=256)\n'
          new = (
              '_DNS_RESOLVE_TIMEOUT_SECONDS = 2.0\n'
              '_DNS_RESOLVE_MAX_INFLIGHT = 4\n'
              '_DNS_RESOLVE_SLOTS = threading.BoundedSemaphore(_DNS_RESOLVE_MAX_INFLIGHT)\n\n\n'
              '@lru_cache(maxsize=256)\n'
          )
          if old not in text:
              raise SystemExit('DNS constant anchor not found')
          text = text.replace(old, new, 1)

          start = text.index('    done = threading.Event()\n', text.index('def _host_resolves_to_public_addresses'))
          end_marker = '        return False\n\n    records = result.get("records")\n'
          end = text.index(end_marker, start)
          replacement = (
              '    fingerprint = hashlib.sha256(host.encode("utf-8", errors="ignore")).hexdigest()[:16]\n'
              '    if not _DNS_RESOLVE_SLOTS.acquire(blocking=False):\n'
              '        _log.warning("DNS safety resolver capacity exhausted: <%s>", fingerprint)\n'
              '        return False\n\n'
              '    done = threading.Event()\n'
              '    result: dict[str, object] = {}\n\n'
              '    def resolve() -> None:\n'
              '        try:\n'
              '            result["records"] = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)\n'
              '        except OSError:\n'
              '            result["records"] = None\n'
              '        finally:\n'
              '            done.set()\n'
              '            _DNS_RESOLVE_SLOTS.release()\n\n'
              '    resolver = threading.Thread(\n'
              '        target=resolve,\n'
              '        name="InvoiceHubDnsSafetyCheck",\n'
              '        daemon=True,\n'
              '    )\n'
              '    try:\n'
              '        resolver.start()\n'
              '    except Exception:\n'
              '        _DNS_RESOLVE_SLOTS.release()\n'
              '        return False\n'
              '    if not done.wait(_DNS_RESOLVE_TIMEOUT_SECONDS):\n'
              '        _log.warning("DNS safety check timed out: <%s>", fingerprint)\n'
              '        return False\n\n'
          )
          text = text[:start] + replacement + text[end + len('        return False\n\n'):]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate bounded resolver capacity
        shell: bash
        run: |
          python - <<'PY'
          import threading
          import time
          from unittest.mock import patch
          from scripts.invoice_fetch import link_downloader as ld

          blocker = threading.Event()
          calls = []
          def stuck(host, *_args, **_kwargs):
              calls.append(host)
              blocker.wait(1.0)
              return []

          ld._host_resolves_to_public_addresses.cache_clear()
          slots = threading.BoundedSemaphore(2)
          with patch.object(ld, '_DNS_RESOLVE_TIMEOUT_SECONDS', 0.02), patch.object(ld, '_DNS_RESOLVE_SLOTS', slots), patch.object(ld.socket, 'getaddrinfo', side_effect=stuck):
              assert not ld._host_resolves_to_public_addresses('a-timeout.example', 443)
              assert not ld._host_resolves_to_public_addresses('b-timeout.example', 443)
              started = time.monotonic()
              assert not ld._host_resolves_to_public_addresses('c-timeout.example', 443)
              assert time.monotonic() - started < 0.1
              assert len(calls) == 2, calls
          blocker.set()
          PY
          python -m py_compile scripts/invoice_fetch/link_downloader.py
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit closure and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_temp-v018-dns-slot-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "fix: bound DNS resolver resource growth"
          git push origin HEAD:fix/v018-mail-scan-bounded-browser
