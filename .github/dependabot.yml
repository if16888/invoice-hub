version: 2

updates:
  # The repository keeps pip-compile output in requirements*.lock.txt. Dependabot
  # treats every .txt requirements file as a manifest, so the grouped PR keeps
  # the source floors and the platform-specific lock pins moving together.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Qt 6.12 causes a Windows native exit crash in the HCI lane. Keep the
      # entire Qt family on the verified line until a deliberate native retest.
      - dependency-name: "pyside6*"
        versions:
          - ">=6.12.0"
      - dependency-name: "shiboken6"
        versions:
          - ">=6.12.0"
      # pyee 14+ requires Python >=3.12; the project baseline is 3.11.
      - dependency-name: "pyee"
        versions:
          - ">=14.0.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Action majors change runtime behaviour and the release workflow contract;
      # upgrade them deliberately instead of through automated PRs.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
