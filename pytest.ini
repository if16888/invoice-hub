[pytest]
# The shared desktop runner may execute an external worktree read-only.  The
# cache provider creates a temporary directory beside the source tree during
# pytest_sessionfinish; on that runner this native path failure can surface as
# a Python access violation after the test itself has passed.  Test outcomes do
# not depend on pytest's last-failed/nodeid cache, so keep the harness portable.
addopts = -p no:cacheprovider
